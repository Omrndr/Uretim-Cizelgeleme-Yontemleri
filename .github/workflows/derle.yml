name: Test ve Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      surum:
        description: "Yayınlanacak sürüm etiketi (ör. v1.0). Boş bırakılırsa yalnızca derlenir."
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birim testleri
        run: python -m unittest discover -s testler -v
      - name: Örnek senaryo (komut satırı)
        run: python -m motor --pdf-yok

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller kur
        run: python -m pip install --upgrade pip pyinstaller
      - name: .exe üret
        run: python paketle.py
      - name: Yapıt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: UretimCizelgeleme-windows
          path: dist/UretimCizelgeleme.exe
      - name: Sürüme ekle (v* etiketi ya da elle tetiklenen sürüm)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.surum != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.surum || github.ref_name }}
          name: ${{ inputs.surum || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/UretimCizelgeleme.exe
